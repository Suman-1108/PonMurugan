<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#F5C45A" />
      <stop offset="70%" stop-color="#D49A26" />
      <stop offset="100%" stop-color="#8F620D" />
    </linearGradient>

    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE8A3" />
      <stop offset="70%" stop-color="#F5C45A" />
      <stop offset="100%" stop-color="#B88014" />
    </linearGradient>

    <!-- Deep Red Gradients -->
    <linearGradient id="deepRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C91824" />
      <stop offset="50%" stop-color="#8B1018" />
      <stop offset="100%" stop-color="#4A050A" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="sunburstGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F5C45A" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#8B1018" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090A0D" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="200" r="190" fill="url(#sunburstGlow)" />

  <!-- Outer Ring with Decorative Beads -->
  <circle cx="250" cy="200" r="165" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,6" opacity="0.6" />
  <circle cx="250" cy="200" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Fireworks Rays radiating from center -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.75" stroke-linecap="round">
    <line x1="250" y1="35" x2="250" y2="70" />
    <line x1="140" y1="75" x2="165" y2="100" />
    <line x1="360" y1="75" x2="335" y2="100" />
    <line x1="85" y1="180" x2="120" y2="185" />
    <line x1="415" y1="180" x2="380" y2="185" />
    <line x1="110" y1="290" x2="140" y2="270" />
    <line x1="390" y1="290" x2="360" y2="270" />
  </g>

  <!-- Sparkle Stars -->
  <g fill="#F5C45A" filter="url(#glow)">
    <polygon points="250,25 253,35 263,38 253,41 250,51 247,41 237,38 247,35" />
    <polygon points="120,60 122,68 130,70 122,72 120,80 118,72 110,70 118,68" />
    <polygon points="380,60 382,68 390,70 382,72 380,80 378,72 370,70 378,68" />
    <polygon points="70,190 72,196 78,198 72,200 70,206 68,200 62,198 68,196" />
    <polygon points="430,190 432,196 438,198 432,200 430,206 428,200 422,198 428,196" />
  </g>

  <!-- Lord Murugan's Divine Golden Vel (Spear) -->
  <g filter="url(#glow)">
    <!-- Vel Spearhead Body -->
    <path d="M 250,65
             C 275,100 310,135 310,195
             C 310,225 295,245 272,250
             C 272,260 265,268 258,272
             L 258,340
             L 242,340
             L 242,272
             C 235,268 228,260 228,250
             C 205,245 190,225 190,195
             C 190,135 225,100 250,65 Z"
          fill="url(#goldGrad)"
          stroke="#FFE8A3"
          stroke-width="2" />

    <!-- Inner Vel Accent & Filigree -->
    <path d="M 250,85
             C 268,115 292,145 292,195
             C 292,215 280,230 262,235
             C 256,215 254,180 250,150
             C 246,180 244,215 238,235
             C 220,230 208,215 208,195
             C 208,145 232,115 250,85 Z"
          fill="url(#deepRedGrad)"
          opacity="0.9" />

    <!-- Sacred Center Spine of Vel -->
    <path d="M 250,80 L 250,250" stroke="#FFF3C4" stroke-width="3" stroke-linecap="round" />

    <!-- Center Ruby Gem / Spark Gem -->
    <circle cx="250" cy="190" r="12" fill="url(#deepRedGrad)" stroke="#FFE8A3" stroke-width="2" />
    <circle cx="248" cy="187" r="3" fill="#FFFFFF" opacity="0.8" />

    <!-- Vel Base Ornament -->
    <rect x="238" y="270" width="24" height="8" rx="3" fill="url(#goldGradLight)" stroke="#8F620D" stroke-width="1" />
    <circle cx="250" cy="345" r="7" fill="url(#goldGradLight)" stroke="#8F620D" stroke-width="1.5" />
  </g>

  <!-- Circular Arch Text Banner -->
  <g id="brand-text">
    <!-- PON MURUGAN Main Heading -->
    <text x="250" y="405"
          text-anchor="middle"
          font-family="'Cinzel', 'Georgia', serif"
          font-size="44"
          font-weight="900"
          letter-spacing="5"
          fill="url(#goldGrad)"
          stroke="#4A050A"
          stroke-width="1"
          filter="url(#glow)">
      PON MURUGAN
    </text>

    <!-- Subtitle Line -->
    <line x1="90" y1="422" x2="200" y2="422" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="205" cy="422" r="3" fill="#F5C45A" />
    <polygon points="250,418 253,422 250,426 247,422" fill="#C91824" />
    <circle cx="295" cy="422" r="3" fill="#F5C45A" />
    <line x1="300" y1="422" x2="410" y2="422" stroke="url(#goldGrad)" stroke-width="1.5" />

    <text x="250" y="445"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', sans-serif"
          font-size="14"
          font-weight="700"
          letter-spacing="6"
          fill="#FFF3C4">
      PREMIUM FIREWORKS
    </text>

    <text x="250" y="468"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', sans-serif"
          font-size="11"
          font-weight="600"
          letter-spacing="4"
          fill="#B8B8B8">
      SIVAKASI • RETAIL &amp; WHOLESALE
    </text>
  </g>
</svg>

